# CI front — lance à chaque push / PR sur main
# Vérifie : install npm, typecheck TypeScript, lint ESLint, tests Vitest, build production

name: CI Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Install + Typecheck + Lint + Tests + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npm run lint
        continue-on-error: true

      - name: Run Vitest with coverage
        run: npm run test:coverage

      - name: Build production
        run: npm run build
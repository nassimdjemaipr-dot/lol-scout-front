# Config Nginx pour servir une SPA React (react-router-dom).
# Points cles :
#  - try_files : renvoie toujours index.html pour les routes non-existantes
#    (sinon React Router ne fonctionne pas sur les URLs directes type /dashboard/player)
#  - Cache long pour les assets versionnes (JS/CSS/images avec hash Vite)
#  - Gzip pour reduire la bande passante

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ─── Compression ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/x-font-ttf
        image/svg+xml
        font/opentype;

    # ─── Assets statiques : cache long ─────────────────────────
    # Les fichiers builds par Vite ont un hash dans le nom (main.abc123.js),
    # donc on peut les cacher tres longtemps sans risque.
    location ~* \.(?:css|js|woff2?|ttf|eot|otf|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── HTML : jamais de cache ────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # ─── SPA fallback : toutes les routes servent index.html ───
    # Sans ca, un F5 sur /players donnerait un 404 nginx au lieu de laisser
    # React Router prendre la main.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Securite : desactive les mentions de version Nginx ────
    server_tokens off;
}
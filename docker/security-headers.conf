# En-tetes de securite, inclus dans chaque bloc location.
# Nginx remplace les add_header herites des qu'un location en declare un :
# les repeter par un include est le seul moyen de garantir qu'ils sont servis
# sur toutes les reponses, assets compris.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

# script-src sans 'unsafe-inline' : le bundle Vite est servi depuis un fichier,
# aucun script en ligne n'est necessaire.
# style-src accepte 'unsafe-inline' car React applique des styles en ligne sur
# quelques composants, et Google Fonts sert sa feuille depuis son domaine.
# connect-src autorise l'API locale et tout hote HTTPS : l'URL de l'API varie
# selon l'environnement et n'est pas connue a la construction de cette image.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:8000 https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
